name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. Qualidade e Validação de Código
  # =========================================================================
  quality:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Validação de Lint (Oxlint)
        run: npm run lint

      - name: Checagem estática de tipos (TypeScript)
        run: npm run typecheck

      - name: Teste de compilação da aplicação (Build)
        run: npm run build

  # =========================================================================
  # 2. Teste do Contêiner Docker
  # =========================================================================
  docker-test:
    name: Build & Test Docker Image
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem de teste local
        run: |
          docker build -t frontend-test:local .

      - name: Iniciar contêiner de teste
        run: |
          docker run -d --name test-container -p 8080:80 frontend-test:local
          sleep 3

      - name: Validar saúde da aplicação (Healthcheck & HTTP 200)
        run: |
          curl --fail -sS http://localhost:8080/healthz || exit 1
          curl --fail -sS http://localhost:8080/ | grep -i "<!doctype html>" || exit 1

      - name: Limpeza do contêiner de teste
        if: always()
        run: |
          docker rm -f test-container || true

  # =========================================================================
  # 3. Publicação da Imagem no Docker Hub
  # =========================================================================
  docker-publish:
    name: Build & Push to Docker Hub
    needs: [quality, docker-test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Gerar tags e metadados para a imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/agendamentos-frontend
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: Construir e enviar imagem para o Docker Hub com cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
